<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="#080c18"/>
  <!-- Big Dipper 7 stars -->
  <circle cx="30" cy="20" r="4" fill="url(#g)"/>
  <circle cx="45" cy="30" r="3" fill="url(#g)"/>
  <circle cx="55" cy="45" r="3" fill="url(#g)"/>
  <circle cx="50" cy="60" r="3" fill="url(#g)"/>
  <circle cx="65" cy="65" r="3" fill="url(#g)"/>
  <circle cx="70" cy="80" r="3" fill="url(#g)"/>
  <circle cx="55" cy="85" r="3" fill="url(#g)"/>
  <!-- Star lines -->
  <line x1="30" y1="20" x2="45" y2="30" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <line x1="45" y1="30" x2="55" y2="45" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <line x1="55" y1="45" x2="50" y2="60" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <line x1="50" y1="60" x2="65" y2="65" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <line x1="65" y1="65" x2="70" y2="80" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <line x1="70" y1="80" x2="55" y2="85" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <!-- D text -->
  <text x="50" y="55" text-anchor="middle" fill="rgba(59,130,246,0.08)" font-size="50" font-weight="bold" font-family="sans-serif">D</text>
</svg>
